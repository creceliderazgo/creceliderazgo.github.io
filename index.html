<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crece">
<meta name="theme-color" content="#E8732C">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Crece Liderazgo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
  :root {
    --carbon: #1A1410;
    --carbon-light: #2A2118;
    --cream: #F5EDE0;
    --cream-dim: #D9CFBE;
    --flame-1: #FFD24A;
    --flame-2: #F5A623;
    --flame-3: #E8732C;
    --flame-4: #C0381A;
    --bronze: #8B6F47;
    --success: #4A9B6E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--carbon);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  body {
    background-image:
      radial-gradient(ellipse 600px 400px at 50% 0%, rgba(232, 115, 44, 0.18), transparent),
      radial-gradient(ellipse 500px 500px at 100% 100%, rgba(139, 111, 71, 0.12), transparent);
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 22px 40px;
  }

  /* ===== PANTALLA DE IDENTIFICACIÓN ===== */
  #pantallaLogin {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
  }

  .logo-wrap {
    background: #111111;
    border-radius: 28px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(232, 115, 44, 0.25), 0 4px 12px rgba(0,0,0,0.3);
    margin-bottom: 8px;
    animation: flicker 4s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { box-shadow: 0 20px 60px rgba(232, 115, 44, 0.25), 0 4px 12px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 20px 70px rgba(232, 115, 44, 0.4), 0 4px 12px rgba(0,0,0,0.3); }
  }

  .logo-img { width: 100%; max-width: 280px; display: block; }

  .tagline-intro {
    font-size: 15px;
    color: var(--cream-dim);
    margin: 18px 0 28px;
    line-height: 1.5;
    max-width: 320px;
  }

  .campo-login {
    width: 100%;
    max-width: 340px;
    text-align: left;
    margin-bottom: 16px;
  }

  .campo-login label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--flame-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .campo-login input {
    width: 100%;
    padding: 16px 18px;
    font-size: 17px;
    border-radius: 14px;
    border: 1.5px solid rgba(245, 237, 224, 0.15);
    background: var(--carbon-light);
    color: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }
  .campo-login input:focus { border-color: var(--flame-3); }
  .campo-login input::placeholder { color: rgba(245, 237, 224, 0.35); }

  .btn-entrar {
    width: 100%;
    max-width: 340px;
    padding: 17px;
    margin-top: 8px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--flame-1), var(--flame-3));
    color: var(--carbon);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(232, 115, 44, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-entrar:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(232, 115, 44, 0.35); }

  .error-login {
    color: var(--flame-4);
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* ===== PANTALLA PRINCIPAL (CALENDARIO) ===== */
  #pantallaPrincipal { display: none; }

  .header-app {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .saludo {
    font-size: 22px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing: -0.01em;
  }
  .saludo span { color: var(--flame-2); }

  .codigo-pill {
    font-size: 12px;
    font-weight: 700;
    color: var(--carbon);
    background: var(--flame-2);
    padding: 5px 12px;
    border-radius: 100px;
    letter-spacing: 0.03em;
  }

  .logo-mini { width: 60px; height: 60px; border-radius: 12px; opacity: 0.95; margin-bottom: 18px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    background: var(--carbon-light);
    border-radius: 14px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--cream-dim);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .tab.activo { background: var(--flame-3); color: var(--carbon); }

  .seccion-titulo {
    font-size: 13px;
    font-weight: 700;
    color: var(--bronze);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 28px 0 14px;
  }
  .seccion-titulo:first-of-type { margin-top: 0; }

  /* ===== LÍNEA DE TIEMPO DE EVENTOS ===== */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: linear-gradient(180deg, var(--flame-2), rgba(139, 111, 71, 0.25));
  }

  .evento {
    position: relative;
    margin-bottom: 22px;
    padding: 16px 18px;
    background: var(--carbon-light);
    border-radius: 16px;
    border: 1px solid rgba(245, 237, 224, 0.06);
  }

  .evento::before {
    content: '';
    position: absolute;
    left: -23px;
    top: 20px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bronze);
    border: 3px solid var(--carbon);
  }

  .evento.proximo {
    border-color: rgba(232, 115, 44, 0.4);
    box-shadow: 0 4px 20px rgba(232, 115, 44, 0.12);
  }
  .evento.proximo::before {
    background: var(--flame-2);
    box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.25), 0 0 16px rgba(245, 166, 35, 0.5);
  }

  .evento-fecha {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--flame-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .evento.proximo .evento-fecha { color: var(--flame-1); }

  .badge-proximo {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--carbon);
    background: var(--flame-1);
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .evento-nombre {
    font-size: 17px;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .evento-desc {
    font-size: 14px;
    color: var(--cream-dim);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .evento-especificaciones {
    font-size: 13px;
    color: var(--flame-2);
    background: rgba(232, 115, 44, 0.1);
    border-radius: 10px;
    padding: 8px 12px;
    line-height: 1.45;
  }
  .evento-especificaciones strong { color: var(--flame-1); }

  .vacio {
    text-align: center;
    padding: 50px 20px;
    color: var(--cream-dim);
    font-size: 14.5px;
    line-height: 1.6;
  }

  /* ===== ESPECIFICACIONES ===== */
  .espec-card {
    background: var(--carbon-light);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border-left: 3px solid var(--flame-3);
  }
  .espec-tema {
    font-size: 15px;
    font-weight: 700;
    color: var(--flame-2);
    margin-bottom: 6px;
  }
  .espec-detalle {
    font-size: 14px;
    color: var(--cream-dim);
    line-height: 1.5;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--cream-dim);
    font-size: 14.5px;
  }

  .footer-app {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(245, 237, 224, 0.08);
  }
  .btn-salir {
    font-size: 13px;
    color: var(--cream-dim);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .banner-notif {
    background: var(--carbon-light);
    border: 1px solid rgba(232, 115, 44, 0.3);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .banner-notif-texto { flex: 1; font-size: 13.5px; color: var(--cream-dim); line-height: 1.4; }
  .banner-notif-btn {
    background: var(--flame-3);
    color: var(--carbon);
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>

    <div class="codigo-pill" id="pillCrece">C40</div>
  </div>
  <div class="saludo">Hola, <span id="nombreSaludo">Nicole</span> 👋</div>

  <div class="tabs">
    <div class="tab activo" id="tabCalendario" onclick="cambiarTab('calendario')">Calendario</div>
    <div class="tab" id="tabEspecificaciones" onclick="cambiarTab('especificaciones')">Especificaciones</div>
  </div>

  <div id="vistaCalendario">
    <div class="loading" id="loadingCalendario">Cargando tu calendario...</div>
  </div>

  <div id="vistaEspecificaciones" style="display:none;">
    <div class="loading" id="loadingEspec">Cargando especificaciones...</div>
  </div>

  <div class="footer-app">
    <button class="btn-salir" onclick="salir()">Salir / cambiar de usuario</button>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURACIÓN — actualizar después de crear el proyecto de Firebase
  // y de implementar el Sheet de Calendario como aplicación web
  // ============================================================
  const URL_API_CALENDARIO = 'https://script.google.com/macros/s/AKfycbwOOmVI3wt5MpcjDykgYk7cAmAhaHrHRKqeynfcJu8h3wOtfGt_lWYKZurlxrogCqqhUw/exec';

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA9KtmJv5cRmA_GKfUyGeyDser34k06auo",
    authDomain: "crece-liderazgo-app.firebaseapp.com",
    projectId: "crece-liderazgo-app",
    storageBucket: "crece-liderazgo-app.firebasestorage.app",
    messagingSenderId: "113309443769",
    appId: "1:113309443769:web:52d77a0e1531fa33e65d68"
  };
  const FIREBASE_VAPID_KEY = "BOzRzmNosEcPQDPzsgytMhnY-UPNVgilSpgktq2WYndZ835-0184HWSk-0nsC0h__EvuZQCu-GltUodJVEUw790";

  let datosActuales = null;
  let firebaseApp = null;
  let messaging = null;

  function inicializarFirebase() {
    try {
      firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
      messaging = firebase.messaging();
    } catch (err) {
      console.warn('Firebase no se pudo inicializar (puede ser normal si aún no está configurado):', err.message);
    }
  }

  function mostrarErrorDebug(mensaje) {
    let div = document.getElementById('debugError');
    if (!div) {
      div = document.createElement('div');
      div.id = 'debugError';
      div.style.cssText = 'background:#cc0000;color:#fff;padding:14px;margin:10px 0;border-radius:10px;font-size:13px;word-break:break-all;line-height:1.4;';
      document.getElementById('pantallaPrincipal').insertBefore(div, document.getElementById('pantallaPrincipal').firstChild.nextSibling);
    }
    div.textContent = '🔴 Error de notificaciones: ' + mensaje;
  }

  function esIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  function estaInstaladoComoPWA() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  let swRegistration = null; // se llena cuando el SW carga exitosamente

  function activarNotificaciones() {
    if (esIOS() && !estaInstaladoComoPWA()) {
      const banner = document.getElementById('bannerNotif');
      banner.innerHTML = '<div class="banner-notif-texto">' +
        'Para recibir notificaciones en iPhone, primero agrega esta app a tu pantalla de inicio: toca el botón ' +
        '<strong>Compartir</strong> (el cuadrito con flecha hacia arriba) en Safari, y elige ' +
        '<strong>"Agregar a pantalla de inicio"</strong>. Después ábrela desde ese ícono nuevo y vuelve a intentar.' +
        '</div>';
      return;
    }

    if (!messaging) {
      alert('Las notificaciones no están disponibles en este navegador o todavía no se ha configurado el servicio.');
      return;
    }

    Notification.requestPermission().then(function(permiso) {
      if (permiso !== 'granted') {
        alert('No se activaron las notificaciones. Puedes intentarlo de nuevo más tarde desde el botón "Activar".');
        return;
      }

      // Usar el service worker ya registrado manualmente si está disponible
      const tokenOptions = { vapidKey: FIREBASE_VAPID_KEY };
      if (swRegistration) {
        tokenOptions.serviceWorkerRegistration = swRegistration;
      }

      messaging.getToken(tokenOptions).then(function(token) {
        const nombre = localStorage.getItem('crece_nombre');
        const crece = localStorage.getItem('crece_codigo');

        fetch(URL_API_CALENDARIO, {
          method: 'POST',
          body: JSON.stringify({ accion: 'registrarToken', token: token, nombre: nombre, codigoCrece: crece })
        }).then(function() {
          document.getElementById('bannerNotif').style.display = 'none';
          localStorage.setItem('crece_notif_activas', 'si');
        }).catch(function(err) {
          mostrarErrorDebug('Error registrando token en Sheet: ' + err.message);
        });
      }).catch(function(err) {
        mostrarErrorDebug('Error obteniendo token Firebase: ' + err.message);
      });
    });
  }

  function revisarEstadoNotificaciones() {
    const yaActivas = localStorage.getItem('crece_notif_activas') === 'si';
    if (yaActivas) return;

    if (esIOS() && !estaInstaladoComoPWA()) {
      document.getElementById('bannerNotif').style.display = 'flex';
      return;
    }

    const soportaNotificaciones = 'Notification' in window && messaging;
    if (soportaNotificaciones && Notification.permission !== 'denied') {
      document.getElementById('bannerNotif').style.display = 'flex';
    }
  }

  function entrar() {
    const nombre = document.getElementById('inputNombre').value.trim();
    const crece = document.getElementById('inputCrece').value.trim().toUpperCase();
    const errorDiv = document.getElementById('errorLogin');

    if (!nombre || !crece) {
      errorDiv.textContent = 'Completa tu nombre y tu código Crece.';
      return;
    }

    errorDiv.textContent = '';
    localStorage.setItem('crece_nombre', nombre);
    localStorage.setItem('crece_codigo', crece);
    mostrarPantallaPrincipal(nombre, crece);
  }

  function salir() {
    localStorage.removeItem('crece_nombre');
    localStorage.removeItem('crece_codigo');
    document.getElementById('pantallaPrincipal').style.display = 'none';
    document.getElementById('pantallaLogin').style.display = 'flex';
    document.getElementById('inputNombre').value = '';
    document.getElementById('inputCrece').value = '';
  }

  function mostrarPantallaPrincipal(nombre, crece) {
    document.getElementById('pantallaLogin').style.display = 'none';
    document.getElementById('pantallaPrincipal').style.display = 'flex';
    document.getElementById('nombreSaludo').textContent = nombre.split(' ')[0];
    document.getElementById('pillCrece').textContent = crece;
    cargarDatos(crece);
    revisarEstadoNotificaciones();
  }

  function cambiarTab(tab) {
    document.getElementById('tabCalendario').classList.toggle('activo', tab === 'calendario');
    document.getElementById('tabEspecificaciones').classList.toggle('activo', tab === 'especificaciones');
    document.getElementById('vistaCalendario').style.display = tab === 'calendario' ? 'block' : 'none';
    document.getElementById('vistaEspecificaciones').style.display = tab === 'especificaciones' ? 'block' : 'none';
  }

  function formatearFecha(isoString) {
    if (!isoString) return '';
    const f = new Date(isoString);
    const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return dias[f.getDay()] + ' ' + f.getDate() + ' de ' + meses[f.getMonth()];
  }

  function cargarDatos(crece) {
    fetch(URL_API_CALENDARIO + '?crece=' + encodeURIComponent(crece))
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        datosActuales = data;
        renderizarCalendario(data);
        renderizarEspecificaciones(data);
      })
      .catch(function(err) {
        document.getElementById('loadingCalendario').textContent = 'No se pudo cargar el calendario. Revisa tu conexión e intenta de nuevo.';
        document.getElementById('loadingEspec').textContent = 'No se pudo cargar la información.';
      });
  }

  function renderizarCalendario(data) {
    const todosEventos = []
      .concat((data.eventosGenerales || []).map(function(e) { return Object.assign({}, e, { tipo: 'General' }); }))
      .concat((data.eventosCrece || []).map(function(e) { return Object.assign({}, e, { tipo: 'Tu generación' }); }));

    todosEventos.sort(function(a, b) { return new Date(a.fecha) - new Date(b.fecha); });

    const ahora = new Date();
    const futuros = todosEventos.filter(function(e) { return new Date(e.fecha) >= ahora; });

    const cont = document.getElementById('vistaCalendario');

    if (futuros.length === 0) {
      cont.innerHTML = '<div class="vacio">No hay eventos próximos registrados todavía.<br>Vuelve a revisar pronto.</div>';
      return;
    }

    let html = '<div class="timeline">';
    futuros.forEach(function(e, idx) {
      const esProximo = idx === 0;
      html += '<div class="evento' + (esProximo ? ' proximo' : '') + '">';
      html += '<div class="evento-fecha">' + formatearFecha(e.fecha) + (esProximo ? '<span class="badge-proximo">PRÓXIMO</span>' : '') + '</div>';
      html += '<div class="evento-nombre">' + e.nombre + '</div>';
      if (e.descripcion) html += '<div class="evento-desc">' + e.descripcion + '</div>';
      if (e.especificaciones) html += '<div class="evento-especificaciones"><strong>Lleva / recuerda:</strong> ' + e.especificaciones + '</div>';
      html += '</div>';
    });
    html += '</div>';

    cont.innerHTML = html;
  }

  function renderizarEspecificaciones(data) {
    const cont = document.getElementById('vistaEspecificaciones');
    const especs = data.especificaciones || [];

    if (especs.length === 0) {
      cont.innerHTML = '<div class="vacio">Todavía no hay especificaciones cargadas.</div>';
      return;
    }

    let html = '';
    especs.forEach(function(e) {
      html += '<div class="espec-card">';
      html += '<div class="espec-tema">' + e.tema + '</div>';
      html += '<div class="espec-detalle">' + e.detalle + '</div>';
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  // Al cargar la página: inicializar Firebase, y si ya hay datos guardados
  // en este celular, entrar directo
  window.addEventListener('DOMContentLoaded', function() {
    inicializarFirebase();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./firebase-messaging-sw.js').then(function(registration) {
        console.log('Service worker registrado correctamente:', registration.scope);
        swRegistration = registration;
      }).catch(function(err) {
        console.warn('No se pudo registrar el service worker de notificaciones:', err.message);
      });
    }

    const nombreGuardado = localStorage.getItem('crece_nombre');
    const codigoGuardado = localStorage.getItem('crece_codigo');
    if (nombreGuardado && codigoGuardado) {
      mostrarPantallaPrincipal(nombreGuardado, codigoGuardado);
    }
  });
</script>
</body>
</html>
